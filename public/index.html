<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: http:;">
    <title>LivelyLyrics - Floating Synced Lyrics Miniplayer</title>
    <link rel="stylesheet" href="vendor/phosphor/regular/style.css">
    <link rel="stylesheet" href="vendor/phosphor/bold/style.css">
    <link rel="stylesheet" href="vendor/phosphor/fill/style.css">
    <link rel="stylesheet" href="vendor/phosphor/duotone/style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="theme-spotify font-medium align-center bg-liquid">
    <div class="window-shell">
        <div id="app-container" class="app-container mode-card">
        <!-- Startup Splash Loading Screen (Liquid Frosted Glass) -->
        <div id="splash-screen" class="splash-screen" data-tauri-drag-region="deep">
            <div class="splash-ambient-orb"></div>
            <div class="splash-card-liquid" data-tauri-drag-region="deep">
                <div class="splash-icon-mark">
                    <i class="ph-fill ph-music-notes"></i>
                </div>
                <div class="splash-text-col">
                    <div class="splash-brand-title">LIVELY<span class="splash-brand-green">LYRICS</span></div>
                    <div class="splash-subtitle" id="splash-status-text">Menghubungkan ke sesi musik...</div>
                </div>
                <div class="splash-mini-eq">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Ambient Reactive Backdrop Glow (Contained inside card with exact border radius) -->
        <div id="ambient-backdrop" class="ambient-backdrop"></div>

        <!-- Floating Drag Header (Hanya untuk Mode Only-Lyrics atau Drag Titlebar) -->
        <header class="drag-header" id="drag-header" data-tauri-drag-region="deep">
            <!-- Hidden compatibility anchors for background references -->
            <div id="normal-window-actions" class="hidden">
                <button id="btn-only-lyrics" class="hidden"></button>
                <button id="btn-pin" class="hidden"></button>
                <button id="btn-ghost" class="hidden"></button>
                <button id="btn-compact" class="hidden"></button>
            </div>
            <div id="header-track-avatar" class="hidden">
                <img id="header-avatar-img" class="hidden" alt="Artwork" />
                <div id="header-avatar-fallback" class="hidden"></div>
                <span id="connection-dot" class="hidden"></span>
                <span id="track-header-ticker" class="hidden"></span>
            </div>

            <!-- Only-Lyrics Dedicated Sleek Toolbar (Unified within Header) -->
            <div id="only-lyrics-exit-pill" class="only-lyrics-toolbar hidden no-drag">
                <button id="btn-exit-only-lyrics" class="pill-btn" title="Kembali ke Mode Normal (Ctrl+Alt+L)">
                    <i class="ph-bold ph-arrows-out-simple"></i>
                    <span>Normal</span>
                </button>
                <button id="btn-resync-pill" class="pill-btn pill-btn-icon" title="Sync Ulang (Ctrl+R)">
                    <i id="icon-resync-pill" class="ph-bold ph-arrows-clockwise"></i>
                </button>
                <button id="btn-font-pill" class="pill-btn" title="Ganti Gaya Font">
                    <i class="ph-bold ph-text-aa"></i>
                    <span id="font-pill-label">Font</span>
                </button>
                <button id="btn-settings-pill" class="pill-btn pill-btn-icon" title="Pengaturan">
                    <i class="ph-bold ph-gear-six"></i>
                </button>
                <button id="btn-close-only-lyrics" class="pill-btn pill-btn-icon pill-btn-close" title="Tutup">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
        </header>

        <!-- Unified Quick Three-Dots Dropdown Menu -->
        <div id="quick-dropdown-menu" class="quick-dropdown-menu hidden no-drag" data-tauri-drag-region="false">
            <button class="dropdown-item" id="dropdown-item-settings">
                <i class="ph-bold ph-gear-six"></i>
                <span>Pengaturan</span>
            </button>
            <button class="dropdown-item" id="dropdown-item-resync">
                <i id="dropdown-icon-resync" class="ph-bold ph-arrows-clockwise"></i>
                <span>Sync Ulang (Ctrl+R)</span>
            </button>
            <div class="dropdown-divider"></div>
            <div class="dropdown-row-actions">
                <button class="dropdown-mini-btn" id="dropdown-item-minimize" title="Minimize Jendela">
                    <i class="ph-bold ph-minus"></i>
                    <span>Minimize</span>
                </button>
                <button class="dropdown-mini-btn dropdown-mini-danger" id="dropdown-item-close" title="Tutup Aplikasi">
                    <i class="ph-bold ph-x"></i>
                    <span>Tutup</span>
                </button>
            </div>
        </div>

        <!-- Ghost Mode Floating Banner Notice -->
        <div id="ghost-badge" class="ghost-badge hidden">
            <span id="ghost-badge-text"><i class="ph-fill ph-ghost"></i> GHOST MODE ON &bull; Tekan <b id="ghost-shortcut-label">Ctrl+Alt+G</b> untuk keluar</span>
        </div>

        <!-- Main Island Content (2-Column Horizontal Split Layout) -->
        <div class="island-main-split" data-tauri-drag-region="deep">
            <!-- Left Column: Player Module (Vertically Centered) -->
            <section class="island-player-panel" id="track-header-card" data-tauri-drag-region="deep">
                <!-- Row 1: Artwork + Song Details -->
                <div class="track-info-layout" data-tauri-drag-region="deep">
                    <div class="artwork-wrapper" id="artwork-wrapper" data-tauri-drag-region="deep">
                        <img id="track-cover-art" class="cover-art-img hidden" alt="Cover Art" src="" />
                        <div id="cover-placeholder" class="cover-placeholder" data-tauri-drag-region="deep">
                            <i class="ph-duotone ph-disc"></i>
                        </div>
                    </div>

                    <div class="track-copy" data-tauri-drag-region="deep">
                        <div id="track-name" class="track-name-display" data-tauri-drag-region="deep" title="Menunggu Spotify...">Menunggu Spotify...</div>
                        <div id="artist-name" class="artist-name-display" data-tauri-drag-region="deep">Putar lagu apa saja di Spotify</div>
                    </div>
                </div>

                <!-- Row 2: Scrubber Timeline Bar -->
                <div class="scrubber-bar-container no-drag" id="scrubber-container" data-tauri-drag-region="false">
                    <span id="current-time" class="time-stamp">00:00</span>
                    <div class="scrubber-track" id="scrubber-track">
                        <div class="scrubber-progress" id="scrubber-progress"></div>
                        <div id="scrubber-tooltip" class="scrubber-tooltip hidden">00:00</div>
                    </div>
                    <span id="total-duration" class="time-stamp" title="Klik untuk beralih Total Durasi / Sisa Waktu">00:00</span>
                </div>

                <!-- Row 3: Playback Controls (Three-Dots, Prev, Play/Pause, Next, Karaoke) -->
                <footer class="playback-dock no-drag" id="playback-dock">
                    <button id="btn-three-dots-player" class="dock-btn" title="Menu Opsi">
                        <i class="ph-bold ph-dots-three"></i>
                    </button>
                    <button id="btn-prev" class="dock-btn" title="Lagu Sebelumnya">
                        <i class="ph-fill ph-skip-back"></i>
                    </button>
                    <button id="btn-playpause" class="dock-btn dock-btn-main" title="Play / Pause">
                        <i id="play-icon" class="ph-fill ph-play"></i>
                        <i id="pause-icon" class="ph-fill ph-pause hidden"></i>
                    </button>
                    <button id="btn-next" class="dock-btn" title="Lagu Selanjutnya">
                        <i class="ph-fill ph-skip-forward"></i>
                    </button>
                    <button id="btn-lyrics-toggle" class="dock-btn dock-btn-karaoke" title="Mode Hanya Lirik (Karaoke)">
                        <i id="icon-karaoke-dock" class="ph-bold ph-microphone"></i>
                    </button>
                    <!-- Hidden compatibility references -->
                    <button id="btn-collapse-player" class="hidden"></button>
                    <button id="btn-resync" class="hidden"><i id="icon-resync-header"></i></button>
                </footer>

                <!-- Compatibility anchor for status badge (kept in DOM for JS handlers) -->
                <div id="playback-status-badge" class="badge-status hidden" style="display: none;">
                    <span id="live-eq" class="live-eq hidden"><span></span><span></span><span></span></span>
                    <span id="playback-status-text">Standby</span>
                </div>
            </section>

            <!-- Right Column: Lyrics Stage (Singing Karaoke Vertical Flow) -->
            <main class="lyrics-stage has-placeholder" id="lyrics-viewport" data-tauri-drag-region="deep">
                <!-- Floating Three-Dots Button for Only-Lyrics Mode -->
                <button id="btn-three-dots-lyrics" class="btn-three-dots-floating hidden no-drag" title="Menu Opsi">
                    <i class="ph-bold ph-dots-three"></i>
                </button>
                <div class="lyrics-flow has-placeholder" id="lyrics-container" data-tauri-drag-region="deep">
                    <div class="stage-placeholder">
                        <div class="music-bars-anim">
                            <span></span><span></span><span></span><span></span>
                        </div>
                        <p class="placeholder-text">Lirik akan sinkron secara otomatis saat Anda memutar lagu.</p>
                    </div>
                </div>
            </main>
        </div>
    </div> <!-- End #app-container -->
</div> <!-- End .window-shell -->
    <script src="tauri-bridge.js"></script>
    <script src="app.js"></script>
</body>
</html>
